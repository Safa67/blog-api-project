<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Project</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
    <header>
        <h1>Blog</h1>
        <nav>
            <ul style="display: flex; justify-content: space-between; align-items: center; list-style-type: none; padding: 0;">

                <div style="display: flex; gap: 15px;">
                    <li><a th:href="@{/home}">Anasayfa</a></li>
                    <li><a th:href="@{/categories}">Kategoriler</a></li>
                    <li><a th:href="@{/create-post}">Yeni Post Yaz</a></li>
                </div>

                <div style="display: flex; gap: 15px;">

                    <li sec:authorize="isAnonymous()">
                        <a th:href="@{/login}" style="color: green; font-weight: bold;">Giriş Yap</a>
                    </li>
                    <li sec:authorize="isAnonymous()">
                        <a th:href="@{/register}" style="color: blue; font-weight: bold;">Kayıt Ol</a>
                    </li>

                    <li sec:authorize="isAuthenticated()">
                        <span style="color: dimgray;">Hoşgeldin, <b sec:authentication="name"></b>!</span>
                    </li>
                    <li sec:authorize="isAuthenticated()">
                        <form th:action="@{/logout}" method="post" style="margin: 0; padding: 0;">
                            <button type="submit" style="background: none; border: none; color: red; font-weight: bold; cursor: pointer; font-size: 16px; padding: 0;">Çıkış Yap</button>
                        </form>
                    </li>

                </div>
            </ul>
        </nav>

    </header>

    <main>
        <section id="content-area">
            <h2>En Son Postlar</h2>

            <div id="data-container">
                <div th:each="blog: ${blogs}" class="data-item">

                    <h3>
                        <a th:href="@{/blog/{id}(id=${blog.id})}" th:text="${blog.title}" style="text-decoration: none; color: navy;"></a>
                    </h3>

                <p th:text="${#strings.abbreviate(blog.content,150)}">icerik</p>

                <div class="item.meta">
                    Kategori: <span th:text="${blog.categoryName}"></span>
                </div>
                    <form th:action="@{/blog/{id}/delete(id=${blog.id})}" method="post" 
                          th:if="${#authorization.expression('isAuthenticated()') and #authentication.name == blog.authorUsername}"
                          style="display: inline;">
                        <button type="submit" style="background: red; color: white; border: none; padding: 3px 8px; cursor: pointer; border-radius: 3px; font-size: 12px;">Postu Sil</button>
                    </form>

                    <hr style="border: 0; border-top: 1px solid lightgrey; margin: 20px 0;">
            </div>

            </div>

            <div style="display: flex; justify-content: space-between; margin-top: 20px;">
                <a th:if="${currentPage > 0}" 
                   th:href="@{/home(page=${currentPage - 1}, keyword=${param.keyword}, tagName=${param.tagName}, categoryName=${param.categoryName})}" 
                   style="padding: 10px 15px; background: navy; color: white; text-decoration: none; border-radius: 4px;">Önceki Sayfa</a>
                
                <span th:unless="${currentPage > 0}"></span>

                <a th:if="${hasNext}" 
                   th:href="@{/home(page=${currentPage + 1}, keyword=${param.keyword}, tagName=${param.tagName}, categoryName=${param.categoryName})}" 
                   style="padding: 10px 15px; background: navy; color: white; text-decoration: none; border-radius: 4px;">Sonraki Sayfa</a>
            </div>
        </section>

        <aside>
            <div class="sidebar-widget" style="margin-bottom: 20px;">

                <h3>Ara</h3>

                <form th:action="@{/home}" method="GET">
                    <input type="text" name="keyword" id="search-input" placeholder="Post ara" style="width: 100%; padding: 5px; margin-bottom: 5px; box-sizing: border-box;">
                    <button type="submit" style="width: 100%; padding: 5px; background: blue; color: white; border: none; cursor: pointer; border-radius: 3px;">Search</button>
                </form>

            </div>

            <div class="sidebar-widget">
                <h3>Etiketler</h3>
                <ul id="tags-list">
                    <li th:each="tag : ${tags}">
                        <a th:href="@{/home(tagName=${tag.name})}" th:text="${tag.name}"
                        style="text-decoration: none; color: inherit"></a>
                    </li>
                </ul>
            </div>
        </aside>
    </main>

</body>
</html>
