<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Blog - Giriş Yap</title>
  <style>
    body { font-family: Tahoma, sans-serif; background-color: whitesmoke; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .container { background: white; padding: 30px; border: 1px solid lightgray; border-radius: 8px; box-shadow: 2px 2px 5px gray; width: 100%; max-width: 400px; }
    h2 { text-align: center; color: black; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; color: dimgray; font-weight: bold; }
    input[type="text"], input[type="password"] { width: 100%; padding: 10px; border: 1px solid lightgray; border-radius: 4px; box-sizing: border-box; }

    button { width: 100%; padding: 10px; background-color: green; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px;}
    button:hover { background-color: darkgreen; }

    .register-link { text-align: center; margin-top: 15px; font-size: 14px;}
    .register-link a { color: blue; text-decoration: none; font-weight: bold;}
    .error-message { color: red; font-size: 14px; margin-bottom: 15px; text-align: center; font-weight: bold;}
  </style>

</head>
<body>
<div class="container">
  <h2>Giriş Yap</h2>

  <div th:if="${param.error}" class="error-message">
    Kullanıcı adı veya şifre hatalı!
  </div>

  <form th:action="@{/login}" method="post">

    <div class="form-group">
      <label for="username">Kullanıcı Adı</label>

      <input type="text" id="username" name="username" required>
    </div>

    <div class="form-group">
      <label for="password">Şifre</label>

      <input type="password" id="password" name="password" required>
    </div>

    <button type="submit">Giriş Yap</button>
  </form>

  <div class="register-link">
    Hesabın yok mu? <a th:href="@{/register}">Hemen Kayıt Ol</a>
  </div>
</div>
</body>
</html>
